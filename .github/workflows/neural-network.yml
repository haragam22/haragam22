name: generate-telemetry

on:
  schedule:
    - cron: "0 5 * * *"   # daily, 5:00 UTC — adjust to taste
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install deps
        run: pip install requests

      - name: generate svgs
        env:
          GH_USERNAME: ${{ github.repository_owner }}
          GH_PAT: ${{ secrets.CONTRIB_READ_PAT }}
        run: python generate_nn.py

      - name: publish to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          force_orphan: true
