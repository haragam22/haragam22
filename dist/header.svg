<svg viewBox="0 0 1000 320" width="1000" height="320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Har Agam Deep Singh — Machine Learning &amp; Generative AI Developer.">
<style>
.mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
.draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 1.4s cubic-bezier(.6,0,.2,1) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.rise { opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards; }
@keyframes rise { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
.fade { opacity: 0; animation: fade .7s ease forwards; }
@keyframes fade { to { opacity: 1; } }
.a1{animation-delay:.2s} .a2{animation-delay:.5s} .a3{animation-delay:.9s} .a4{animation-delay:1.2s} .a5{animation-delay:1.4s} .a6{animation-delay:1.7s}
@media (prefers-reduced-motion: reduce) {
  .draw,.rise,.fade { animation: none; }
  .draw{stroke-dashoffset:0} .rise,.fade{opacity:1}
}
</style>
<rect width="1000" height="320" fill="#fbf3f1"/>
<line class="draw a1" x1="48" y1="52" x2="952" y2="52" stroke="#e6d3cf" stroke-width="1"/>
<g class="fade a1">
<text class="mono" fill="#9c8783" x="48" y="38" font-size="11" letter-spacing="3.5">PORTFOLIO — INDEX № 001</text>
<text class="mono" fill="#9c8783" x="952" y="38" font-size="11" letter-spacing="3.5" text-anchor="end">INDIA</text>
</g>
<g class="rise a2">
<text fill="#3a2c2c" class="mono" x="46" y="150" font-size="60" letter-spacing="-2">Har Agam Deep Singh</text>
</g>
<g class="fade a3">
<text fill="#9c8783" class="mono" x="48" y="184" font-size="17">Machine Learning &amp; Generative AI Developer.</text>
</g>
<g class="fade a4">
<text fill="#b39d98" class="mono" x="48" y="234" font-size="12.5" letter-spacing="1">focus  ▸</text>
<text fill="#c96a7c" class="mono" x="128" y="234" font-size="12.5" letter-spacing="1">machine learning · generative ai · multi-agent systems · backend</text>
</g>
<g class="fade a5">
<text fill="#b39d98" class="mono" x="48" y="260" font-size="12.5" letter-spacing="1">open to internships · research collaboration</text>
</g>
<line class="draw a5" x1="48" y1="292" x2="952" y2="292" stroke="#e6d3cf" stroke-width="1"/>
<g class="fade a6">
<text fill="#9c8783" class="mono" x="48" y="316" font-size="11.5" letter-spacing="3">MACHINE LEARNING</text>
<text fill="#c96a7c" class="mono" x="193.6" y="316" font-size="11.5">·</text>
<text fill="#9c8783" class="mono" x="209.6" y="316" font-size="11.5" letter-spacing="3">GENERATIVE AI</text>
<text fill="#c96a7c" class="mono" x="329.4" y="316" font-size="11.5">·</text>
<text fill="#9c8783" class="mono" x="345.4" y="316" font-size="11.5" letter-spacing="3">BACKEND</text>
<text fill="#9c8783" class="mono" x="952" y="316" font-size="11.5" letter-spacing="3" text-anchor="end">MAIT — 2028</text>
</g>
</svg>